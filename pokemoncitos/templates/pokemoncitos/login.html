```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Pokémon World</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #172554, #6d28d9, #db2777);
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #6d28d9;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6d28d9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5b21b6;
        }

        .error {
            color: #b91c1c;
            background: #fee2e2;
            padding: 10px;
            border-radius: 8px;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6d28d9;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <h1>⚡ Pokémon World</h1>
        <p class="descripcion">Inicia sesión para acceder a tu cuenta</p>

        {% if form.errors %}
            <p class="error">
                Usuario o contraseña incorrectos. Inténtalo nuevamente.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">Nombre de usuario</label>
            <input
                type="text"
                name="username"
                id="id_username"
                autocomplete="username"
                required
            >

            <label for="id_password">Contraseña</label>
            <input
                type="password"
                name="password"
                id="id_password"
                autocomplete="current-password"
                required
            >

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit">Iniciar sesión</button>
        </form>

        <a class="volver" href="{% url 'inicio' %}">
            Volver a Pokémon World
        </a>
    </div>
</body>
</html>
```
